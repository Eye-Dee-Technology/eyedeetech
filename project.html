<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start a Project — Eye Dee Tech</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#ff6d18;
      --bg:#0f172a;
      --card:rgba(15,23,42,.75);
      --text:#fff;
      --muted:#94a3b8;
      --border:rgba(148,163,184,.12);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:1rem;
      background:var(--bg);
      color:var(--text);
      font-family:'Inter',sans-serif;
    }

    .card{
      width:100%;
      max-width:720px;
      background:var(--card);
      padding:2rem;
      border-radius:16px;
      border:1px solid var(--border);
      backdrop-filter:blur(10px);
    }

    h1{
      margin-top:0;
    }

    p{
      color:var(--muted);
    }

    label{
      display:block;
      margin-top:1rem;
      font-weight:600;
    }

    input,
    textarea,
    select{
      width:100%;
      padding:.8rem;
      margin-top:.35rem;
      border-radius:10px;
      border:1px solid var(--border);
      background:#111827;
      color:#fff;
    }

    textarea{
      resize:vertical;
    }

    .btn{
      margin-top:1.2rem;
      background:var(--primary);
      color:#fff;
      border:none;
      padding:.8rem 1.4rem;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
    }

    .btn:hover{
      opacity:.95;
    }

    .status{
      margin-top:1rem;
      font-weight:600;
    }
  </style>
</head>
<body>

<main class="card">

  <h1>Start a Project</h1>
  <p>Tell us about your project and we’ll contact you shortly.</p>

  <form id="projectForm" action="https://formspree.io/f/your_form_id" method="POST">

    <label>Name *</label>
    <input type="text" name="name" required>

    <label>Email *</label>
    <input type="email" name="email" required>

    <label>Company</label>
    <input type="text" name="company">

    <label>Phone</label>
    <input type="tel" name="phone">

    <label>Estimated Budget</label>
    <input type="text" name="budget">

    <label>Timeline</label>
    <select name="timeline">
      <option value="">Select timeline</option>
      <option>Less than 4 weeks</option>
      <option>1–3 months</option>
      <option>3–6 months</option>
      <option>More than 6 months</option>
    </select>

      <label for="p-type">Project type</label>
      <select id="p-type" name="project_type">
        <option value="">Select type</option>
        <option value="api_development">API Development & Integration</option>
        <option value="ai_solutions">Artificial Intelligence (AI) Solutions</option>
        <option value="ar_vr">Augmented Reality (AR) & Virtual Reality (VR)</option>
        <option value="big_data">Big Data Processing</option>
        <option value="blockchain">Blockchain Development & Consulting</option>
        <option value="bi_systems">Business Intelligence (BI) Systems</option>
        <option value="cloud_computing">Cloud Computing Services (AWS, Azure, Google Cloud)</option>
        <option value="cloud_migration">Cloud Migration & Optimization</option>
        <option value="computer_vision">Computer Vision Services</option>
        <option value="custom_software">Custom Software Development</option>
        <option value="cybersecurity">Cybersecurity Consulting</option>
        <option value="data_protection">Data Protection & Encryption</option>
        <option value="data_science">Data Science & Advanced Analytics</option>
        <option value="devops">DevOps & CI/CD Implementation</option>
        <option value="digital_innovation">Digital Innovation Services</option>
        <option value="digital_transformation">Digital Transformation Consulting</option>
        <option value="engineering_design">Engineering Design & Prototyping</option>
        <option value="enterprise_software">Enterprise Software Solutions (ERP, CRM)</option>
        <option value="environmental_tech">Environmental & Sustainability Tech Solutions</option>
        <option value="iaas">Infrastructure as a Service (IaaS)</option>
        <option value="iot">Internet of Things (IoT) Solutions</option>
        <option value="it_management">IT Project Management</option>
        <option value="it_support">IT Support & Managed Services</option>
        <option value="lab_systems">Laboratory Information Systems</option>
        <option value="ml_development">Machine Learning Model Development</option>
        <option value="mobile_app">Mobile App Development (Android & iOS)</option>
        <option value="nlp">Natural Language Processing (NLP)</option>
        <option value="network_security">Network Security & Monitoring</option>
        <option value="penetration_testing">Penetration Testing & Vulnerability Assessment</option>
        <option value="predictive_analytics">Predictive Analytics</option>
        <option value="rd">Research & Development (R&D)</option>
        <option value="robotics">Robotics & Embedded Systems</option>
        <option value="scientific_computing">Scientific Computing & Simulation</option>
        <option value="server_management">Server Management & Virtualization</option>
        <option value="smart_systems">Smart Systems & Automation</option>
        <option value="qa_testing">Software Testing & Quality Assurance</option>
        <option value="system_admin">System Administration</option>
        <option value="documentation">Technical Documentation</option>
        <option value="tech_consulting">Technology Consulting</option>
        <option value="tech_strategy">Technology Strategy & Advisory</option>
        <option value="training">Training & Technical Support</option>
        <option value="uiux_design">UI/UX Design & Prototyping</option>
        <option value="web_development">Web Application Development</option>
      </select>

    <label>Project Details *</label>
    <textarea name="message" rows="6" required></textarea>

    <button class="btn" type="submit" id="submitBtn">
      Send Project Brief
    </button>
    <div class="status" id="formStatus" aria-live="polite"></div>

  </form>

</main>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('projectForm');
    var status = document.getElementById('formStatus');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      status.textContent = '';

      var formData = new FormData(form);

      fetch(form.action, {
        method: 'POST',
        headers: { Accept: 'application/json' },
        body: formData,
      })
        .then(function (response) {
          if (response.ok) {
            window.location.href = 'thank-you.html';
            return;
          }
          return response.json().then(function (data) {
            throw new Error(data.error || 'Unable to send the project brief.');
          });
        })
        .catch(function (error) {
          status.textContent = error.message || 'Unable to send the project brief. Please try again later.';
          status.style.color = '#f59e0b';
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Project Brief';
        });
    });
  });
</script>

  <footer style="margin-top:2rem;color:var(--muted);width:100%;display:flex;justify-content:center;padding:1rem 0">
    <div style="max-width:720px;width:100%;display:flex;justify-content:space-between;align-items:center">
      <div>© 2026 Eye Dee Tech</div>

    </div>
  </footer>

  <a href="https://wa.me/message/NLCECW4FU2QDK1" style="position:fixed;right:20px;bottom:100px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;z-index:999;text-decoration:none;" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>

</body>
</html>
