<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Booking Successful | Eye Dee Tech</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#050505;
    color:#ffffff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

/* Background Glow */

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(circle, rgba(255,170,0,0.15), transparent 70%);
    top:-150px;
    right:-100px;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:radial-gradient(circle, rgba(255,140,0,0.12), transparent 70%);
    bottom:-150px;
    left:-100px;
}

/* Main Card */

.success-box{
    width:90%;
    max-width:650px;
    background:#0b0b0b;
    border:1px solid rgba(255,170,0,0.25);
    border-radius:24px;
    padding:60px 40px;
    text-align:center;
    position:relative;
    z-index:2;
    box-shadow:
        0 0 40px rgba(255,170,0,0.08),
        0 0 100px rgba(255,170,0,0.04);
}

/* Accent Lines */

.success-box::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:5px;
    background:linear-gradient(90deg,#ffb000,#ff7a00);
    border-radius:24px 24px 0 0;
}

.logo{
    font-size:18px;
    font-weight:600;
    letter-spacing:4px;
    margin-bottom:20px;
    color:#ffb000;
}

.icon{
    width:95px;
    height:95px;
    margin:0 auto 30px;
    border-radius:50%;
    border:2px solid #ffb000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    color:#ffb000;
    box-shadow:0 0 25px rgba(255,176,0,0.25);
}

h1{
    font-size:42px;
    font-weight:700;
    margin-bottom:18px;
    color:#ffffff;
}

p{
    font-size:17px;
    line-height:1.8;
    color:#d6d6d6;
    max-width:500px;
    margin:auto;
}

/* Button */

.btn{
    display:inline-block;
    margin-top:35px;
    padding:15px 34px;
    background:linear-gradient(135deg,#ffb000,#ff7a00);
    color:#000;
    text-decoration:none;
    border-radius:50px;
    font-weight:600;
    transition:0.3s ease;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(255,176,0,0.35);
}

/* Floating Shapes */

.shape{
    position:absolute;
    border:1px solid rgba(255,176,0,0.2);
    transform:rotate(45deg);
    z-index:1;
}

.shape1{
    width:120px;
    height:120px;
    top:80px;
    left:100px;
}

.shape2{
    width:70px;
    height:70px;
    bottom:100px;
    right:120px;
}

@media(max-width:768px){

    .success-box{
        padding:50px 25px;
    }

    h1{
        font-size:32px;
    }

    p{
        font-size:15px;
    }

}

</style>
</head>

<body>

<div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="success-box">

    <div class="logo">EYE DEE TECH</div>

    <div class="icon">
        ✓
    </div>

    <h1>Booking Confirmed</h1>

    <p>
        Thank you for booking with Eye Dee Tech. 
        Your appointment has been received successfully 
        and our team will contact you shortly.
    </p>

    <a href="index.html" class="btn">
        Home
    </a>

</div>
